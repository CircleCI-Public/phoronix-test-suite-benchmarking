version: 2.1

# The install / benchmark / report logic lives in ./scripts so it can be shared
# with GitHub Actions and run locally (see test-benchmark.sh). This config just
# wires those scripts to the executor matrix.

orbs:
  # Installs the `gh` CLI, used by the results job to pull the GitHub Actions
  # x86 benchmark result for merging (see scripts/fetch-gha-result.sh).
  gh: circleci/github-cli@3.0.0

workflows:
  version: 2
  benchmark:
    jobs:
      - benchmark:
          name: gen1
          executor: gen1
          result: gen1
      - benchmark:
          name: gen2
          executor: gen2
          result: gen2
      - benchmark:
          name: machine-gen2
          executor: machine-gen2
          result: machine-gen2
      - benchmark:
          name: gen3
          executor: gen3
          result: gen3
      - results:
          requires:
            - gen1
            - gen2
            - gen3
            - machine-gen2

executors:
  gen1:
    resource_class: large
    docker:
      - image: cimg/base:current-24.04
  gen2:
    resource_class: large.gen2
    docker:
      - image: cimg/base:current-24.04
  machine-gen2:
    resource_class: large.gen2
    machine:
      image: ubuntu-2404:current
  gen3:
    resource_class: large.gen3
    machine:
      image: ubuntu-2404:current

jobs:
  benchmark:
    parameters:
      executor:
        type: executor
      result:
        type: string
    executor: << parameters.executor >>
    steps:
      - install
      - benchmark:
          result: << parameters.result >>

  results:
    executor: gen2
    steps:
      # Report-only job: needs the PTS binary to merge/render, not the test
      # profiles -- skip installing them.
      - install:
          install-tests: false
      - attach_workspace:
          at: /home/circleci/.phoronix-test-suite/test-results
      # Pull the GitHub Actions x86 benchmark result for this commit so it can be
      # merged alongside the CircleCI generations. Best-effort: if it's missing
      # (GHA still running, failed, or no token configured) the report is still
      # produced from gen1/gen2/gen3 alone. Needs GITHUB_TOKEN / GH_TOKEN
      # (actions:read on this repo) set as a project/context env var.
      - gh/install
      - run:
          name: Fetch GitHub Actions benchmark result
          command: ./scripts/fetch-gha-result.sh
      - run:
          name: Merge test results into HTML report
          command: |
            results=(gen1 gen2 gen3 machine-gen2)
            # x86 dir only exists if the GHA fetch above succeeded.
            [ -d "$HOME/.phoronix-test-suite/test-results/x86" ] && results+=(x86)
            ./scripts/report.sh "${results[@]}"
      - run:
          name: Pack test results
          command: tar czfv test-results.tgz ~/.phoronix-test-suite/test-results
          when: always
      - store_artifacts:
          path: "/home/circleci/.phoronix-test-suite/test-results"
      - store_artifacts:
          path: test-results.tgz
      - store_artifacts:
          path: reports

commands:
  install:
    parameters:
      install-tests:
        type: boolean
        default: true
    steps:
      - checkout
      - run:
          name: Install PTS<<# parameters.install-tests >> + benchmark tests<</ parameters.install-tests >>
          command: PTS_INSTALL_TESTS=<< parameters.install-tests >> ./scripts/install.sh

  benchmark:
    parameters:
      result:
        type: string
    steps:
      - run:
          name: Run benchmark
          no_output_timeout: 60m
          command: ./scripts/benchmark.sh << parameters.result >>
      - persist_to_workspace:
          root: /home/circleci/.phoronix-test-suite/test-results
          paths:
            - << parameters.result >>
