version: 2.1

# The install / benchmark / report logic lives in ./scripts so it can be shared
# with GitHub Actions and run locally (see test-benchmark.sh). This config just
# wires those scripts to the executor matrix.

orbs:
  # Installs the `gh` CLI, used by the results job to pull the GitHub Actions
  # x86 benchmark result for merging (see scripts/fetch-gha-result.sh).
  gh: circleci/github-cli@3.0.0

workflows:
  version: 2
  benchmark:
    jobs:
      - benchmark:
          name: gen1
          executor: gen1
          result: gen1
      - benchmark:
          name: gen2
          executor: gen2
          result: gen2
      - benchmark:
          name: machine-gen2
          executor: machine-gen2
          result: machine-gen2
      - benchmark:
          name: gen3
          executor: gen3
          result: gen3
      - results:
          requires:
            - gen1
            - gen2
            - gen3
            - machine-gen2

  windows-benchmark:
    jobs:
      # Gen1 -- windows-server-2025-gui:current
      - win-benchmark:
          name: win-gen1-<< matrix.size >>
          matrix:
            parameters:
              size: ["medium", "large", "xlarge", "2xlarge"]
          image: windows-server-2025-gui:current
          rc-suffix: ""
          result-prefix: win-gen1
      # Gen2 standard AMI -- windows-server-2025:2026.08.1
      - win-benchmark:
          name: win-gen2-<< matrix.size >>
          matrix:
            parameters:
              size: ["medium", "large", "xlarge", "2xlarge", "2xlarge+"]
          image: "windows-server-2025:2026.08.1"
          rc-suffix: ".gen2"
          result-prefix: win-gen2
      # Gen2 optimized AMI -- windows-server-2025:2026.08.2
      - win-benchmark:
          name: win-gen2opt-<< matrix.size >>
          matrix:
            parameters:
              size: ["medium", "large", "xlarge", "2xlarge", "2xlarge+"]
          image: "windows-server-2025:2026.08.2"
          rc-suffix: ".gen2"
          result-prefix: win-gen2opt
      # Merge all Windows results on Linux
      - win-results:
          requires:
            - win-gen1-medium
            - win-gen1-large
            - win-gen1-xlarge
            - win-gen1-2xlarge
            - win-gen2-medium
            - win-gen2-large
            - win-gen2-xlarge
            - win-gen2-2xlarge
            - "win-gen2-2xlarge+"
            - win-gen2opt-medium
            - win-gen2opt-large
            - win-gen2opt-xlarge
            - win-gen2opt-2xlarge
            - "win-gen2opt-2xlarge+"

executors:
  gen1:
    resource_class: large
    docker:
      - image: cimg/base:current-24.04
  gen2:
    resource_class: large.gen2
    docker:
      - image: cimg/base:current-24.04
  machine-gen2:
    resource_class: large.gen2
    machine:
      image: ubuntu-2404:current
  gen3:
    resource_class: large.gen3
    machine:
      image: ubuntu-2404:current

jobs:
  # --- Linux benchmark job ---
  benchmark:
    parameters:
      executor:
        type: executor
      result:
        type: string
    executor: << parameters.executor >>
    steps:
      - install
      - benchmark:
          result: << parameters.result >>

  results:
    executor: gen2
    steps:
      # Report-only job: needs the PTS binary to merge/render, not the test
      # profiles -- skip installing them.
      - install:
          install-tests: false
      - attach_workspace:
          at: /home/circleci/.phoronix-test-suite/test-results
      # Pull the GitHub Actions x86 benchmark result for this commit so it can be
      # merged alongside the CircleCI generations. Best-effort: if it's missing
      # (GHA still running, failed, or no token configured) the report is still
      # produced from gen1/gen2/gen3 alone. Needs GITHUB_TOKEN / GH_TOKEN
      # (actions:read on this repo) set as a project/context env var.
      - gh/install
      - run:
          name: Fetch GitHub Actions benchmark result
          command: ./scripts/fetch-gha-result.sh
      - run:
          name: Merge test results into HTML report
          command: |
            results=(gen1 gen2 gen3 machine-gen2)
            # x86 dir only exists if the GHA fetch above succeeded.
            [ -d "$HOME/.phoronix-test-suite/test-results/x86" ] && results+=(x86)
            ./scripts/report.sh "${results[@]}"
      - run:
          name: Pack test results
          command: tar czfv test-results.tgz ~/.phoronix-test-suite/test-results
          when: always
      - store_artifacts:
          path: "/home/circleci/.phoronix-test-suite/test-results"
      - store_artifacts:
          path: test-results.tgz
      - store_artifacts:
          path: reports

  # --- Windows benchmark job (parameterized via matrix) ---
  win-benchmark:
    parameters:
      size:
        type: string
      image:
        type: string
      rc-suffix:
        type: string
        default: ""
      result-prefix:
        type: string
    machine:
      image: << parameters.image >>
      shell: powershell.exe
    resource_class: windows.<< parameters.size >><< parameters.rc-suffix >>
    steps:
      - win-install
      - win-benchmark:
          result: << parameters.result-prefix >>-<< parameters.size >>

  win-results:
    executor: gen2
    steps:
      - install:
          install-tests: false
      - attach_workspace:
          at: /home/circleci/.phoronix-test-suite/test-results
      - run:
          name: Merge Windows test results into HTML report
          command: |
            results=(
              win-gen1-medium win-gen1-large win-gen1-xlarge win-gen1-2xlarge
              win-gen2-medium win-gen2-large win-gen2-xlarge win-gen2-2xlarge win-gen2-2xlarge+
              win-gen2opt-medium win-gen2opt-large win-gen2opt-xlarge win-gen2opt-2xlarge win-gen2opt-2xlarge+
            )
            ./scripts/report.sh "${results[@]}"
      - run:
          name: Pack test results
          command: tar czfv win-test-results.tgz ~/.phoronix-test-suite/test-results
          when: always
      - store_artifacts:
          path: "/home/circleci/.phoronix-test-suite/test-results"
      - store_artifacts:
          path: win-test-results.tgz
      - store_artifacts:
          path: reports

commands:
  # --- Linux commands ---
  install:
    parameters:
      install-tests:
        type: boolean
        default: true
    steps:
      - checkout
      - run:
          name: Install PTS<<# parameters.install-tests >> + benchmark tests<</ parameters.install-tests >>
          command: PTS_INSTALL_TESTS=<< parameters.install-tests >> ./scripts/install.sh

  benchmark:
    parameters:
      result:
        type: string
    steps:
      - run:
          name: Run benchmark
          no_output_timeout: 60m
          command: ./scripts/benchmark.sh << parameters.result >>
      - persist_to_workspace:
          root: /home/circleci/.phoronix-test-suite/test-results
          paths:
            - << parameters.result >>

  # --- Windows commands ---
  win-install:
    parameters:
      install-tests:
        type: boolean
        default: true
    steps:
      - checkout
      - run:
          name: Install PTS<<# parameters.install-tests >> + benchmark tests<</ parameters.install-tests >>
          no_output_timeout: 30m
          command: |
            $env:PTS_INSTALL_TESTS = "<< parameters.install-tests >>"
            & .\scripts\windows\install.ps1

  win-benchmark:
    parameters:
      result:
        type: string
    steps:
      - run:
          name: Run benchmark
          no_output_timeout: 60m
          command: |
            & .\scripts\windows\benchmark.ps1 "<< parameters.result >>"
      - run:
          name: Stage results for workspace
          command: |
            $src = "$env:USERPROFILE\.phoronix-test-suite\test-results\<< parameters.result >>"
            $dest = ".\test-results\<< parameters.result >>"
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -Recurse -Force $src $dest
      - persist_to_workspace:
          root: test-results
          paths:
            - << parameters.result >>
